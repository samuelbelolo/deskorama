<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon: a plane taking off over the buildings, on the macOS icon grid (an 824-point tile in a 1024 canvas). -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="#2d5da8"/>
    <circle cx="296" cy="296" r="96" fill="#f2e3b6"/>

    <g fill="#c3cac6">
      <rect x="100" y="630" width="170" height="180"/>
      <rect x="270" y="590" width="140" height="220"/>
      <rect x="770" y="600" width="160" height="210"/>
    </g>

    <rect x="100" y="760" width="824" height="170" fill="#3a424e"/>
    <g fill="#edf0ea">
      <rect x="170" y="832" width="120" height="24"/>
      <rect x="370" y="832" width="120" height="24"/>
      <rect x="570" y="832" width="120" height="24"/>
      <rect x="770" y="832" width="120" height="24"/>
    </g>

    <g transform="translate(410 545) rotate(-20)" fill="#e8561e">
      <path d="M0 -30 L400 -30 Q452 -30 452 0 Q452 30 400 30 L0 30 Z"/>
      <path d="M0 -30 L-40 -130 L34 -130 L104 -30 Z"/>
      <path d="M170 0 L90 160 L176 160 L300 0 Z" fill="#b8400f"/>
    </g>
  </g>
</svg>
