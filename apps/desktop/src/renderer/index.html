<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The page loads its own script, styles and fonts only: no network, no inline script. The Theme injects its
         stylesheet as a <style> element, hence 'unsafe-inline' for styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:"
    />
    <title>Deskorama</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="screen" class="screen"></div>
  </body>
</html>
