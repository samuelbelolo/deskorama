<!doctype html>
<!-- "vibrant": the window always opens on the system's sidebar material, so the sidebar stays see-through. -->
<html class="vibrant">
  <head>
    <meta charset="utf-8" />
    <!-- The page loads its own script, styles and pictures only: no network, no inline script, no inline style. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Deskorama</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="settings"></div>
  </body>
</html>
